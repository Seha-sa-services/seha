const leaveData = {};
for (let key in rawData) {
    let d = rawData[key];
    leaveData[key] = {
        id: d[0], name: d[1], nat: d[2], dur: d[3],
        entry: d[4], exit: d[5], doc: d[6], title: d[7], hosp: d[8]
    };
}

function showFirstInterface() {
    document.getElementById('dynamicContent').innerHTML = `
        <div class="main-heading">الإجازات المرضية</div>
        <div class="sub-heading">خدمة الاستعلام عن الإجازات المرضية تتيح لك الاستعلام عن حالة طلبك للإجازة ويمكنك طباعتها عن طريق تطبيق صحتي</div>
        <div class="input-group">
            <div class="input-card"><input type="text" id="serviceCode" placeholder="رمز الخدمة"></div>
            <div class="input-card"><input type="text" id="idNumber" placeholder="رقم الهوية / الإقامة"></div>
        </div>
        <div class="btn-container">
            <button class="search-btn" onclick="validateAndSearch()"><i class="fas fa-search"></i> استعلام</button>
        </div>
        <div id="errorArea"></div>
    `;
    const lowerDiv = document.getElementById('staticLowerSection');
    if (lowerDiv) lowerDiv.style.display = 'block';
}

function validateAndSearch() {
    const sCode = document.getElementById('serviceCode').value.trim();
    const idNum = document.getElementById('idNumber').value.trim();
    const errorArea = document.getElementById('errorArea');
    errorArea.innerHTML = "";
    if (!sCode && idNum) { errorArea.innerHTML = `<div class="error-toast"><i class="fas fa-exclamation-triangle"></i> ادخل رمز الخدمة</div>`; return; }
    if (sCode && !idNum) { errorArea.innerHTML = `<div class="error-toast"><i class="fas fa-exclamation-triangle"></i> ادخل رقم الهوية/الإقامة</div>`; return; }
    if (!sCode && !idNum) { errorArea.innerHTML = `<div class="error-toast"><i class="fas fa-exclamation-triangle"></i> يرجى إدخال البيانات المطلوبة</div>`; return; }
    
    const record = leaveData[sCode];
    if (record && record.id === idNum) {
        showSecondInterface(sCode, record);
    } else {
        errorArea.innerHTML = `<div class="error-toast"><i class="fas fa-ban"></i> لا توجد نتائج</div>`;
    }
}

function showSecondInterface(code, data) {
    document.getElementById('dynamicContent').innerHTML = `
        <div class="report-header"><h2>تقرير إجازة مرضية - منصة صحة</h2></div>
        <div class="info-grid">
            <div class="info-row"><span class="info-label"><i class="fas fa-hashtag"></i> رمز الخدمة</span><span class="info-value">${code}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-user"></i> الاسم</span><span class="info-value">${data.name}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-id-card"></i> رقم الهوية/الإقامة</span><span class="info-value">${data.id}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-globe"></i> الجنسية</span><span class="info-value">${data.nat}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-hourglass-half"></i> مدة الإجازة</span><span class="info-value">${data.dur}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-calendar-alt"></i> تاريخ الدخول</span><span class="info-value">${data.entry}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-calendar-check"></i> تاريخ الخروج</span><span class="info-value">${data.exit}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-user-md"></i> اسم الطبيب</span><span class="info-value">${data.doc}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-briefcase"></i> المسمى الوظيفي</span><span class="info-value">${data.title}</span></div>
            <div class="info-row"><span class="info-label"><i class="fas fa-hospital-alt"></i> المستشفى</span><span class="info-value">${data.hosp}</span></div>
        </div>
        <button class="back-button" onclick="showFirstInterface()"><i class="fas fa-redo"></i> استعلام جديد</button>
    `;
    const lowerDiv = document.getElementById('staticLowerSection');
    if (lowerDiv) lowerDiv.style.display = 'none';
}

showFirstInterface();
